server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: municipal-complaint-system
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:municipal}
    username: ${DB_USERNAME:municipal}
    # No default on purpose: startup fails fast if DB_PASSWORD is not provided.
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  cache:
    # "redis" (default) or "simple" (in-memory, no Redis needed). Cache failures never break requests (Part 7).
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 5m
      key-prefix: "mcps::"
      use-key-prefix: true
      cache-null-values: false

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  task:
    scheduling:
      pool:
        size: 2                    # priority recalculation and SLA escalation must not block each other

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.municipal.system: INFO
    org.hibernate.SQL: WARN

# ---------------------------------------------------------------------------
# Application-specific settings (bound to com.municipal.system.config.AppProperties)
# ---------------------------------------------------------------------------
app:
  security:
    jwt:
      # No default on purpose: must be provided, at least 32 characters (HS256 key).
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      issuer: municipal-complaint-system

  # Priority Score = (severity * W1) + (affectedPeople * W2) + (ageInHours * W3) [+ critical boost]
  priority:
    weights:
      severity: 0.5                # W1
      affected-people: 0.3         # W2
      age-hours: 0.2               # W3
    critical-hazard-boost: 50      # added when severity >= critical-severity-threshold
    critical-severity-threshold: 5
    baseline-affected-count: 1     # the reporting citizen counts as one affected person
    score-scale: 2                 # decimal places of the stored/returned score
    rounding-mode: HALF_UP         # applied once, to the final score
    recalculation:
      enabled: true
      initial-delay-ms: 60000
      fixed-delay-ms: 300000       # every 5 minutes after the previous run completes

  sla:
    # Resolution target in hours, by severity (1 = minor ... 5 = critical)
    target-hours-by-severity:
      1: 168
      2: 120
      3: 72
      4: 48
      5: 24
    escalation:
      enabled: true
      initial-delay-ms: 90000
      fixed-delay-ms: 600000       # every 10 minutes after the previous run completes

  analytics:
    high-priority-threshold: 25.0  # scores at or above this count as "high priority"

  cache:
    analytics-ttl: 5m
    priority-queue-ttl: 1m

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # If both email and password are set and no admin exists, one ADMIN user is created at startup.
  bootstrap-admin:
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
